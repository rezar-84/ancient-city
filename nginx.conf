server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/octet-stream model/gltf-binary;
  gzip_min_length 1024;

  types { model/gltf-binary glb; model/vnd.usdz+zip usdz; }
  include /etc/nginx/mime.types;

  location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }

  # fingerprinted bundles: cache forever
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  # media: cache a week
  location ~* ^/(img|renders|audio|models|terrain|brand)/ { add_header Cache-Control "public, max-age=604800"; try_files $uri =404; }

  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    try_files $uri /index.html;
  }
}
