server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/octet-stream model/gltf-binary;
  gzip_min_length 1024;

  types { model/gltf-binary glb; model/vnd.usdz+zip usdz; }
  include /etc/nginx/mime.types;

  # add_header is not inherited once a location sets its own, so every location repeats these
  set $csp "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://tile.googleapis.com https://*.gstatic.com; media-src 'self' blob:; connect-src 'self' blob: data: https://tile.googleapis.com https://www.gstatic.com; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; object-src 'none'";

  location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }

  # service worker: always revalidate so a new media manifest takes effect on the next visit
  location = /sw.js {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff;
    add_header Content-Security-Policy $csp;
    try_files $uri =404;
  }

  # fingerprinted bundles: cache forever
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff;
    try_files $uri =404;
  }

  # media: cache a week (the service worker keeps them longer, keyed by content hash)
  location ~* ^/(img|renders|audio|models|terrain|brand|art|characters|tex)/ {
    add_header Cache-Control "public, max-age=604800";
    add_header X-Content-Type-Options nosniff;
    add_header Cross-Origin-Resource-Policy same-origin;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), xr-spatial-tracking=(self)";
    add_header Content-Security-Policy $csp;
    try_files $uri /index.html;
  }
}
